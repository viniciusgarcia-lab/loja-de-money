  .bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.45) 0%,
      rgba(30,2,5,0.6) 50%,
      rgba(10,0,2,0.88) 100%

    z-index: 1;

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .crown {
    font-size: 2.5rem;
    margin-bottom: 0.4rem;
    filter: drop-shadow(0 0 10px rgba(201,168,76,0.5));
  }

  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.8rem, 10vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(180,10,30,0.6), 0 2px 20px rgba(201,168,76,0.3);
    line-height: 1;
  }

  .tagline {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.85rem, 3vw, 1.15rem);
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 0.6rem;
    margin-bottom: 2.2rem;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 2.2rem;
  }

  .price-card {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 14px;
    padding: 1.6rem 2.4rem;
    display: inline-block;
    margin-bottom: 2.2rem;
    backdrop-filter: blur(12px);
  }

  .price-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
  }

  .price-value {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 900;
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(201,168,76,0.3);
  }

  .price-sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 0.3rem;
  }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--gold);
    color: #1a0005;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.06em;
    padding: 1rem 2rem;
    border-radius: 10px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 28px rgba(180,10,30,0.4), 0 2px 12px rgba(201,168,76,0.2);
  }

  .discord-btn:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 32px rgba(201,168,76,0.4);
  }

  .discord-icon {
    width: 22px;
    height: 22px;
    fill: #1a0005;
  }

  .cta-note {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin-top: 0.9rem;
    letter-spacing: 0.05em;
  }

  .ornament {
    margin-top: 3rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    opacity: 0.3;
  }

  .ornament-line {
    width: 60px;
    height: 1px;
    background: var(--gold);
  }

  .ornament-diamond {
    width: 7px;
    height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
  }
</style>
