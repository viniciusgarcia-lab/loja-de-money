<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Loja Império</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --wine-dark: #3a0509;
    --text-muted: #c8a89a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #f5ecd7;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
  }

  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding:
      max(2rem, env(safe-area-inset-top))
      max(1.25rem, env(safe-area-inset-right))
      max(2rem, env(safe-area-inset-bottom))
      max(1.25rem, env(safe-area-inset-left));
    text-align: center;
  }

  /* ---------- FUNDO ----------
     Imagem original: quadrada, fundo preto puro, busto centralizado.
     - Retrato (celular / tablet em pé): ocupa a tela toda com "cover",
       com o foco ajustado para manter o rosto visível.
     - Paisagem (computador): a imagem fica inteira, na proporção original,
       ancorada à direita; a borda esquerda se dissolve no preto da página.
     100lvh (com fallback 100vh) evita o "pulo" quando a barra do navegador
     do celular aparece/some. */
  .bg-img,
  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100lvh;
  }

  .bg-img {
    background-color: #000;
    background-image: url('fundo-imperio.png');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: 55% 40%;
    z-index: 0;
  }

  .bg-overlay {
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.25) 0%,
      rgba(25,2,5,0.38) 50%,
      rgba(10,0,2,0.72) 100%
    );
    z-index: 1;
  }

  @media (min-aspect-ratio: 1/1) {
    .bg-img {
      left: auto;
      right: max(0px, calc((100vw - 1600px) / 2)); /* telas ultralargas: não cola na borda */
      width: 100vh;
      width: 100lvh;
      background-size: contain;
      background-position: center;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 26%);
              mask-image: linear-gradient(to right, transparent 0%, #000 26%);
    }

    /* escurece só atrás do texto (centro); a estátua à direita fica viva */
    .bg-overlay {
      background:
        radial-gradient(ellipse 30% 58% at 50% 50%, rgba(0,0,0,0.60), transparent 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.10) 0%, rgba(20,1,4,0.15) 55%, rgba(10,0,2,0.55) 100%);
    }
  }

  /* telas bem estreitas: prioriza o rosto, que fica à direita da imagem */
  @media (max-aspect-ratio: 9/19) {
    .bg-img { background-position: 80% 40%; }
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .crown {
    font-size: 2.5rem;
    margin-bottom: 0.4rem;
    filter: drop-shadow(0 0 10px rgba(201,168,76,0.5));
  }

  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.8rem, 10vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(180,10,30,0.6), 0 2px 20px rgba(201,168,76,0.3);
    line-height: 1;
  }

  .tagline {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.85rem, 3vw, 1.15rem);
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 0.6rem;
    margin-bottom: 2.2rem;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 2.2rem;
  }

  .price-card {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 14px;
    padding: 1.6rem 2.4rem;
    display: inline-block;
    margin-bottom: 2.2rem;
    backdrop-filter: blur(12px);
  }

  .price-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
  }

  .price-value {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 900;
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(201,168,76,0.3);
  }

  .price-sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 0.3rem;
  }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--gold);
    color: #1a0005;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.06em;
    padding: 1rem 2rem;
    border-radius: 10px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 28px rgba(180,10,30,0.4), 0 2px 12px rgba(201,168,76,0.2);
  }

  .discord-btn:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 32px rgba(201,168,76,0.4);
  }

  .discord-icon {
    width: 22px;
    height: 22px;
    fill: #1a0005;
  }

  .cta-note {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin-top: 0.9rem;
    letter-spacing: 0.05em;
  }

  .ornament {
    margin-top: 3rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    opacity: 0.3;
  }

  .ornament-line {
    width: 60px;
    height: 1px;
    background: var(--gold);
  }

  .ornament-diamond {
    width: 7px;
    height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
  }
</style>
</head>
<body>

<div class="bg-img"></div>
<div class="bg-overlay"></div>

<section class="hero">
  <div class="content">
    <div class="crown">👑</div>
    <h1 class="brand-name">Loja Império</h1>
    <p class="tagline">Money &amp; Muito Mais</p>
    <div class="divider"></div>

    <div class="price-card">
      <p class="price-label">Taxa de conversão</p>
      <p class="price-value">1M = R$ 4,00</p>
      <p class="price-sub">Melhor preço, maior confiança</p>
    </div>

    <a class="discord-btn" href="https://discord.gg/4nwRpfcUjE" target="_blank" rel="noopener">
      <svg class="discord-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Entrar no Discord
    </a>
    <p class="cta-note">🌐 discord.gg/4nwRpfcUjE</p>

    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>
    </div>
  </div>
</section>

</body>
</html>
